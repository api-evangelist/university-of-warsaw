aid: university-of-warsaw
name: University of Warsaw
description: >-
  The University of Warsaw (Uniwersytet Warszawski) is Poland's largest and highest-ranked
  university and a member of the 4EU+ European University Alliance. Unusually for this cohort it
  operates real first-party programmable surfaces rather than only vendor tenancies: the USOS API
  at usosapps.uw.edu.pl, a documented OAuth 1.0a REST-like protocol over the institution's own
  academic database (courses, faculties, calendar, users, payments), and two springdoc services that publish
  their own OpenAPI and Swagger UI — the Student Portal 4EU+ API at api.sp4eu.uw.edu.pl (OpenAPI
  3.1, 74 paths, read endpoints answer anonymously) and Jaskier at api.jaskier.uw.edu.pl, the
  university's central institutional API (OpenAPI 3.0.1, 729 paths, 458 schemas, bearer-gated
  data). Research data is handled by two institution-hosted
  repositories — Dane Badawcze UW (Dataverse, DOI prefix 10.58132) and ReIn UW (DSpace-CRIS 8.1) —
  each with a native REST API and an OAI-PMH 2.0 endpoint. The university runs its own Shibboleth
  SAML identity provider at login.uw.edu.pl, registered in eduGAIN through the Polish PIONIER.Id
  federation, and it is a DataCite repository client and a Crossref member with 31 DOI prefixes.
  What it does NOT have is a single central developer portal: the USOS developers site is the only
  signup surface, the library discovery layer is an Ex Libris Alma/Primo tenancy, and the LMS is a
  Moodle install with no public LTI advertisement.
