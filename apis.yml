- aid: university-of-warsaw:rdr-oai-pmh
  name: Dane Badawcze UW OAI-PMH Endpoint
  description: >-
    OAI-PMH 2.0 metadata harvesting endpoint for the University of Warsaw Research Data Repository (Dataverse).
    The repository identifies itself as the "Dane Badawcze UW Dataverse OAI Archive" and supports standard
    verbs such as Identify, ListRecords and GetRecord for harvesting research dataset metadata.
  humanURL: https://danebadawcze.uw.edu.pl/
  baseURL: https://danebadawcze.uw.edu.pl/oai
