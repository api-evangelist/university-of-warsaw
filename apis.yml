x-coverage:
  state: covered
  reason: covered
  detail: >-
    The University of Warsaw is one of the few institutions in this cohort with genuinely
    first-party programmable surfaces, and every one of them was probed live on 2026-09-01. Two
    institution-operated API families answer publicly: the USOS API at usosapps.uw.edu.pl
    (machine-readable method reference at services/apiref/method_index, OAuth 1.0a for anything
    beyond anonymous methods) and, newly found in this run, the Student Portal 4EU+ API at
    api.sp4eu.uw.edu.pl, which serves its own OpenAPI 3.1 at /v3/api-docs plus Swagger UI and
    returns real data anonymously — and behind it Jaskier at api.jaskier.uw.edu.pl, the
    university's central institutional API, whose OpenAPI 3.0.1 (729 paths, 458 schemas) is public
    while every data endpoint is bearer-gated. Jaskier is linked from no UW developer page; it was
    found because a Student Portal 4EU+ 500 response leaked its upstream URL. Two institution-hosted research repositories expose native REST
    plus OAI-PMH 2.0 (Dane Badawcze UW on Dataverse, ReIn UW on DSpace-CRIS 8.1). The university
    runs its own Shibboleth SAML IdP at login.uw.edu.pl, registered in eduGAIN by PIONIER.Id, and
    is a DataCite repository client (REPOD.DBUW, prefix 10.58132) and Crossref member 4211.
    Limits worth stating: there is no central developer portal and no open-data portal — no host
    answered at data./dane./otwartedane.uw.edu.pl; library discovery is an Ex Libris Alma/Primo
    tenancy on the national OMNIS catalogue, recorded as a tenant relationship rather than a
    contract; the LMS is Moodle with no public LTI advertisement; and the USOS developer signup
    page returns HTTP 403 to non-browser clients while rendering the real registration form, so it
    is graded live, not dead.
