    fronted by an Apereo CAS login at logowanie.uw.edu.pl. Its metadata is machine-readable at the entityID
    URL and declares shibmd:Scope login.uw.edu.pl, OrganizationName "Uniwersytet Warszawski" and SingleSignOnService
