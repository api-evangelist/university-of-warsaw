- aid: university-of-warsaw:jaskier-api
  x-operator: institution
  name: Jaskier API
  description: >-
    Jaskier is the University of Warsaw's central institutional data and services API — the backend
    behind MyUW and the university's in-house applications, built and operated by the university's
    own IT department (build artifact group pl.edu.uw.dsk, version 1.2.25). It publishes its own
    springdoc-generated OpenAPI 3.0.1 at /v3/api-docs with 729 paths, 458 schemas and 125 tags,
    covering people and profiles, courses and course registration, buildings, campuses and building
    accessibility, laboratories and research sets, projects and programmes, publications, patents,
    licences, framework agreements, public procurement plans, student organisations, events, IT
    services, dictionaries and translations, plus the Sp4eu subtree that feeds the Student Portal
    4EU+. The specification and /api/v1/system/build answer anonymously; every data endpoint probed
    returned 401 and needs an Authorization: Bearer token, with users authenticated through the
    university's SAML IdP. Discovered on 2026-09-01 from an upstream URL leaked in a Student Portal
    4EU+ error envelope — it is not linked from any UW developer page.
  humanURL: https://api.jaskier.uw.edu.pl/
  baseURL: https://api.jaskier.uw.edu.pl
  tags:
  - Academic Data
  - Course Catalog
  - Campus
  - Research Administration
  - OpenAPI
  properties:
