- aid: university-of-warsaw:rdr-rest
  name: Dane Badawcze UW Research Data Repository REST API
  description: >-
    The University of Warsaw Research Data Repository (Dane Badawcze UW) is a Dataverse-based institutional
    repository for long-term storage and open sharing of research data across all disciplines, with DOI
    assignment, versioning and Central Authentication System integration. As a Dataverse instance it exposes
    the native Dataverse REST API for search, dataset and file operations.
  humanURL: https://danebadawcze.uw.edu.pl/
