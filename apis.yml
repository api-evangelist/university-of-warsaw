- aid: university-of-warsaw:sp4eu-api
  x-operator: institution
  name: Student Portal 4EU+ API
  description: >-
    The REST API behind the Student Portal 4EU+, the shared student services portal of the 4EU+
    European University Alliance, built and operated by the University of Warsaw. It publishes its
    own springdoc-generated OpenAPI 3.1 (74 paths, 44 schemas) at /v3/api-docs and serves Swagger
    UI at the API root. Resources cover the alliance course catalogue and syllabi, mobility
    options, housing, tutorials, person roles, profiles and student documents. Read endpoints such
    as GET /api/v1/Tutorial answer anonymously; Admin and User surfaces need a bearer token from
    /access/login, and the portal authenticates users against the University of Warsaw SAML IdP.
    Operator evidence: servers[0] is https://api.sp4eu.uw.edu.pl, the build info at /system/build
    reports group pl.edu.uw.dsk.sp4eu, and the SP's eduGAIN registration names University of
    Warsaw as the entity organisation.
