      type: object
      properties:
        id:
          type: string
        buildingId:
          type: string
        namePl:
          type: string
        nameEn:
          type: string
        categoryCode:
          type: string
        commentPl:
          type: string
        commentEn:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        campusCode:
          type: string
        url:
          type: string
