openapi: 3.2.0
info:
  title: Jaskier Admin API
  version: 1.2.25
servers:
- url: https://api.jaskier.uw.edu.pl
tags:
- name: Admin
paths:
  /api/v1/Admin/UpdatePerson/{usosId}:
    post:
      tags:
      - Admin
      summary: Aktualizacja osoby o wskazanym usosId
      operationId: updatePersonById
      parameters:
      - name: usosId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
  /api/v1/Admin/UpdatePeople:
    post:
      tags:
      - Admin
      summary: Pobranie słownika osób
      operationId: updatePeople
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
  /api/v1/Admin/UpdateCourses:
    post:
      tags:
      - Admin
      summary: Pobranie kursów
      operationId: updateCourses
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
  /api/v1/Admin/UpdateCourses/{usosId}:
    post:
      tags:
      - Admin
      summary: Pobranie kursów, których koordynatorem jest osoba o podanym usosId
      operationId: updateCoursesByUsosId
      parameters:
      - name: usosId
        in: path
        required: true
        schema:
          type: string
      - name: activeTermsOnly
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
  /api/v1/Admin/AddThumbnailsToExistingFiles:
    post:
      tags:
      - Admin
      summary: Dodanie miniatur do istniejących plików
      operationId: addThumbnailsToExistingFiles
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
