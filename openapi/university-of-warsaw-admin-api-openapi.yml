                - 511 NETWORK_AUTHENTICATION_REQUIRED
      security:
      - Authorization: []
  /api/v1/Admin/Synchronization:
    get:
      tags:
      - Admin
      operationId: getSynchronizations
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SynchronizationResponse'
      security:
      - Authorization: []
      summary: Get synchronizations
      x-summary-source: derived
  /api/v1/Admin/Synchronization/Collision:
    get:
      tags:
      - Admin
      summary: Sprawdzenie kolizji synchronizacji i sugestia czasu
      operationId: checkCollision
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SynchronizationCollisionRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SynchronizationCollisionResponse'
      security:
      - Authorization: []
