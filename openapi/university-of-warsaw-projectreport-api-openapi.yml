          - CUNI
          - UAH
          - SU
          - KU
          - UNIMI
          - UW
          - UNIGE
          - PARIS_2
        orcid:
          type: string
        firstName:
          type: string
        middleNames:
          type: string
        lastName:
          type: string
        email:
          type: string
        profileId:
          type: string
        degree:
          type: string
        universityIndexNumber:
          type: string
    ProjectReportResponse:
      type: object
      properties:
        details:
          $ref: '#/components/schemas/ProjectResponse'
        abstractDetails:
          $ref: '#/components/schemas/ProjectAbstractResponse'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssetResponse'
        contractType:
          $ref: '#/components/schemas/ProjectContractTypeResponse'
        discipline:
          $ref: '#/components/schemas/ProjectDisciplineResponse'
        financing:
          $ref: '#/components/schemas/ProjectFinancingResponse'
        otherInfo:
          $ref: '#/components/schemas/ProjectOtherInfoResponse'
        owners:
          $ref: '#/components/schemas/RecordOwnersResponse'
        team:
          $ref: '#/components/schemas/ProjectTeamResponse'
    ProjectFinancingDetailsResponse:
      type: object
      properties:
        grantAgreementNumber:
          type: string
        grantAgreementDate:
          type: string
          format: date
        budget:
          type: number
        budgetUw:
          type: number
        grantAmount:
          type: number
        ownContributionRequired:
          type: boolean
        ownContribution:
          type: number
    ProjectProfileMemberResponse:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        projectId:
          type: string
        profileName:
          type: string
        roleId:
          type: integer
          format: int32
        roleNamePl:
          type: string
        roleNameEn:
          type: string
        regulation75RoleId:
          type: integer
          format: int32
        regulation75RoleNamePl:
          type: string
        regulation75RoleNameEn:
          type: string
        unitCode:
          type: string
        unitNamePl:
          type: string
        unitNameEn:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
    ProjectAppendixResponse:
      type: object
      properties:
        id:
          type: string
          description: id aneksu do projektu
        projectId:
          type: string
          description: id projektu
        number:
          type: string
          description: id numer do aneksu
        documentDate:
          type: string
          format: date
        notes:
          type: string
      description: Aneks do projektu
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
