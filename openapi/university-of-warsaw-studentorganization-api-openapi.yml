components:
  schemas:
    StudentOrganizationLinkResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    StudentOrganizationNameRequest:
      type: object
      properties:
        id:
          type: string
        namePl:
          maxLength: 255
          minLength: 0
          type: string
        nameEn:
          maxLength: 255
          minLength: 0
          type: string
        shortNamePl:
          maxLength: 255
          minLength: 0
          type: string
        shortNameEn:
          maxLength: 255
          minLength: 0
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          maxLength: 1000
          minLength: 0
          type: string
    StudentOrganizationStatusRequest:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          maxLength: 1000
          minLength: 0
          type: string
    StudentOrganizationNameResponse:
      type: object
      properties:
        id:
          type: string
        namePl:
          type: string
        nameEn:
          type: string
        shortNamePl:
          type: string
        shortNameEn:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          type: string
    StudentOrganizationFounderResponse:
      type: object
      properties:
        id:
          type: string
        personId:
          type: string
        studentOrganizationId:
          type: string
        note:
          type: string
        name:
          type: string
        preferredName:
          type: string
        email:
          type: string
        usosId:
          type: string
        universityIndexNumber:
          type: string
        phoneNumbers:
          type: array
          items:
            type: string
        fieldOfStudy:
          type: string
        yearOfStudy:
          type: integer
          format: int32
    StudentOrganizationActivityRequest:
      required:
      - mainProfile
      type: object
      properties:
        id:
          type: string
        mainProfile:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          maxLength: 1000
          minLength: 0
          type: string
    StudentOrganizationBoardMemberRequest:
      required:
      - personId
      - role
      type: object
      properties:
        id:
          type: string
        personId:
          type: string
        role:
          type: string
          enum:
          - CHAIR_M
          - CHAIR_F
          - CHAIR_N
          - VICE_CHAIR_M
          - VICE_CHAIR_F
          - VICE_CHAIR_N
          - TREASURER_M
          - TREASURER_F
          - TREASURER_N
          - SECRETARY_M
          - SECRETARY_F
          - SECRETARY_N
          - BOARD_MEMBER_M
          - BOARD_MEMBER_F
          - BOARD_MEMBER_N
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          maxLength: 1000
          minLength: 0
          type: string
        fieldOfStudy:
          maxLength: 256
          minLength: 0
          type: string
        yearOfStudy:
          type: integer
          format: int32
    StudentOrganizationRequest:
      type: object
      properties:
        registeredDate:
          type: string
          format: date
        contactPersonId:
          type: string
        registerNumber:
          type: integer
          format: int32
        email:
          type: string
        url:
          type: string
        type:
          type: string
          enum:
          - GENERAL
          - STUDENT
          - DOCTORAL
        initNamePl:
          type: string
        initNameEn:
          type: string
    StudentOrganizationStatusResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          type: string
    StudentOrganizationFounderRequest:
      required:
      - personId
      type: object
      properties:
        id:
          type: string
        personId:
          type: string
        note:
          type: string
        fieldOfStudy:
          type: string
        yearOfStudy:
          type: integer
          format: int32
    StudentOrganizationUnitRequest:
      required:
      - unitCode
      type: object
      properties:
        id:
          type: string
        unitCode:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          maxLength: 1000
          minLength: 0
          type: string
    StudentOrganizationUnitResponse:
      type: object
      properties:
        unitCode:
          type: string
        unitNamePl:
          type: string
        unitNameEn:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          type: string
    StudentOrganizationBoardMemberResponse:
      type: object
      properties:
        id:
          type: string
        personId:
          type: string
        name:
          type: string
        preferredName:
          type: string
        usosId:
          type: string
        email:
          type: string
        phoneNumbers:
          type: array
          items:
            type: string
        role:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          type: string
        fieldOfStudy:
          type: string
        yearOfStudy:
          type: integer
          format: int32
        universityIndexNumber:
          type: string
    OdataResponsePersonViewResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PersonViewResponse'
        totalCount:
          type: integer
          format: int32
    StudentOrganizationSupervisorResponse:
      type: object
      properties:
        id:
          type: string
        personId:
          type: string
        name:
          type: string
        degree:
          type: string
        email:
          type: string
        role:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        note:
          type: string
        unitCode:
          type: string
        unitNamePl:
          type: string
        unitNameEn:
          type: string
    StudentOrganizationLinkRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    StudentOrganizationResponse:
      type: object
      properties:
        id:
          type: string
        namePl:
          type: string
        nameEn:
          type: string
        shortNamePl:
          type: string
        shortNameEn:
          type: string
        email:
          type: string
        url:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
        reportSubmitted:
          type: boolean
        unitCode:
          type: string
        unitNamePl:
          type: string
        unitNameEn:
          type: string
        mainProfiles:
          type: array
          items:
            type: string
        registeredDate:
          type: string
          format: date
        registerNumber:
          type: integer
          format: int32
        contactPersonId:
          type: string
        contactPersonName:
          type: string
        contactPersonEmail:
          type: string
        mainSupervisorPersonId:
          type: string
        mainSupervisorName:
          type: string
        mainSupervisorEmail:
          type: string
        mainSupervisorDegree:
          type: string
        mainPresidentPersonId:
          type: string
        mainPresidentName:
          type: string
        mainPresidentEmail:
          type: string
    StudentOrganizationReportResponse:
      type: object
      properties:
        id:
          type: string
        year:
          type: integer
          format: int32
        submittedDate:
          type: string
          format: date
        accepted:
          type: boolean
        note:
          type: string
    StudentOrganizationRelationsReportResponse:
      type: object
      properties:
        studentOrganization:
          $ref: '#/components/schemas/StudentOrganizationResponse'
        names:
          type: array
          items:
            $ref: '#/components/schemas/StudentOrganizationNameResponse'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/StudentOrganizationStatusResponse'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/StudentOrganizationActivityResponse'
        units:
          type: array
          items:
            $ref: '#/components/schemas/StudentOrganizationUnitResponse'
        boardMembers:
          type: array
          items:
