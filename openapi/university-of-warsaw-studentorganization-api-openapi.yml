  /api/v1/StudentOrganization/{id}/Report:
    get:
      tags:
      - StudentOrganization
      operationId: getReportsForStudentOrganization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentOrganizationReportResponse'
      security:
      - Authorization: []
      summary: Get reports for student organization
      x-summary-source: derived
  /api/v1/StudentOrganization/SearchPerson:
    get:
      tags:
      - StudentOrganization
      summary: Listowanie danych o osobach
      operationId: searchPersonForStudentOrganization
      parameters:
      - name: $skip
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: $top
        in: query
        required: false
        schema:
          maximum: 100
          type: integer
          format: int64
          default: 10
      - name: $inlinecount
        in: query
        required: false
        schema:
          type: string
      - name: $orderby
        in: query
        required: false
        schema:
          type: string
          default: lastName,firstName,email
      - name: searchValue
        in: query
        required: false
        schema:
          type: string
          default: searchValue
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OdataResponsePersonViewResponse'
      security:
      - Authorization: []
  /api/v1/StudentOrganization/SearchPerson('{personId}'):
    get:
      tags:
