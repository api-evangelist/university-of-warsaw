  /api/v1/PersonSystemRoleSap/SearchPerson:
    get:
      tags:
      - PersonSystemRoleSap
      summary: Wyszukiwanie osoby
      operationId: searchPersonForProject_1
      parameters:
      - name: $skip
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: $top
        in: query
        required: false
        schema:
          maximum: 100
          type: integer
          format: int64
          default: 10
      - name: $inlinecount
        in: query
        required: false
        schema:
          type: string
      - name: $orderby
        in: query
        required: false
        schema:
          type: string
          default: lastName,firstName,email
      - name: searchValue
        in: query
        required: false
        schema:
          type: string
          default: searchValue
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OdataResponsePersonViewResponse'
      security:
      - Authorization: []
  /api/v1/PersonSystemRoleSap/SearchPerson('{personId}'):
    get:
      tags:
      - PersonSystemRoleSap
      summary: Czytanie informacji o osobie
      operationId: getSearchPersonForProject_1
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonViewResponse'
      security:
      - Authorization: []
  /api/v1/PersonSystemRoleSap/Roles:
