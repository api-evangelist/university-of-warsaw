    get:
      tags:
      - PersonSystemRoleSap
      operationId: getWorkflowMembers
      parameters:
      - name: workflowId
        in: query
        required: true
        schema:
          type: string
      - name: economicDepartmentCode
        in: query
        required: true
        schema:
          type: string
