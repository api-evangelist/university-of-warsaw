components:
  schemas:
    SapVim2Response:
      type: object
      properties:
        nazwaRoli:
          type: string
        jgOd:
          type: string
        id1Trasy:
          type: string
        jgDo:
          type: string
        typAgenta:
          type: string
        idAgenta:
          type: string
    SapSecurityResponse:
      type: object
      properties:
        sapRole:
          type: string
        sapLogin:
          type: string
    SapCoaResponse:
      type: object
      properties:
        col1:
          type: string
        col2:
          type: string
        col3:
          type: string
        col4:
          type: string
        col5Dg:
          type: string
        col6Email:
          type: string
        col7:
          type: string
        col8Imie:
          type: string
        col9Nazwisko:
          type: string
        col10:
          type: string
        col11LoginSap:
          type: string
        col12:
          type: string
        col13:
          type: string
        col14:
          type: string
        col15:
          type: string
        col16LoginSap:
          type: string
        col17:
          type: string
        col18:
          type: string
        col19:
          type: string
        col20:
          type: string
    SapVim1Response:
      type: object
      properties:
        nazwaRoli:
          type: string
        jg1:
          type: string
        id1TrasyOd:
          type: string
        jg2:
          type: string
        id1TrasyTo:
          type: string
        typAgenta:
          type: string
        idAgenta:
          type: string
    PersonViewResponse:
      type: object
      properties:
        personId:
          type: string
        university:
          type: string
          enum:
          - CUNI
          - UAH
          - SU
          - KU
          - UNIMI
          - UW
          - UNIGE
          - PARIS_2
        orcid:
          type: string
        firstName:
          type: string
        middleNames:
          type: string
        lastName:
          type: string
        email:
          type: string
        profileId:
          type: string
        degree:
          type: string
        universityIndexNumber:
          type: string
    OdataResponsePersonViewResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PersonViewResponse'
        totalCount:
          type: integer
          format: int32
    SapWorkflowResponse:
      type: object
      properties:
        col1:
          type: string
        col2:
          type: string
        col3:
          type: string
        col4:
          type: string
        col5:
          type: string
        col6:
          type: string
        col7:
          type: string
        col8:
          type: string
        col9:
          type: string
        col10:
          type: string
        col11:
          type: string
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
