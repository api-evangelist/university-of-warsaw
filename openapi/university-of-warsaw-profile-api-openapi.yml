        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileScienceDisciplineDetailsResponse'
      security:
      - Authorization: []
    servers:
    - url: https://api.jaskier.uw.edu.pl
  /api/v1/Profile/{id}/ScienceDiscipline/{profileScienceDisciplineId}:
    put:
      tags:
      - Profile
      summary: Aktualizacja dyscyplin naukowych w profilu
      operationId: updateProfileScienceDiscipline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: profileScienceDisciplineId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileScienceDisciplineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileScienceDisciplineResponse'
      security:
      - Authorization: []
    delete:
      tags:
      - Profile
      summary: Usunięcie dyscypliny naukowej profilu
      operationId: removeProfileScienceDiscipline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: profileScienceDisciplineId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
    servers:
    - url: https://api.jaskier.uw.edu.pl
  /api/v1/Profile/{id}/ProfileUnit/{profileUnitId}:
    put:
      tags:
      - Profile
      summary: Aktualizacja jednostki profilu
      operationId: updateProfileUnit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: profileUnitId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUnitRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileUnitResponse'
      security:
      - Authorization: []
    delete:
      tags:
      - Profile
      summary: Usunięcie jednostki profilu
      operationId: removeProfileUnit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: profileUnitId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
    servers:
    - url: https://api.jaskier.uw.edu.pl
  /api/v1/Profile/{id}/ProfileDegree/{profileDegreeId}:
