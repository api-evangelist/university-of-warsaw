      security:
      - Authorization: []
    servers:
    - url: https://api.jaskier.uw.edu.pl
  /api/v1/Profile/{id}/ProfileDegree:
    get:
      tags:
      - Profile
      summary: Listowanie danych o stopniach i tytułach dla podanego profileId
      operationId: queryForProfileDegrees
      parameters:
      - name: id
        in: path
