openapi: 3.2.0
info:
  title: University Of Warsaw Profile API
  version: '1.0'
  description: 'Operations tagged Profile across 2 of this provider''s published API definitions: university-of-warsaw-jaskier-api.json, university-of-warsaw-sp4eu-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.jaskier.uw.edu.pl
- url: https://api.sp4eu.uw.edu.pl
tags:
- name: Profile
paths:
  /api/v1/Profile/{id}:
    get:
      tags:
      - Profile
      summary: Czytanie profilu z podanym id
      operationId: getProfileById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileResponse'
      security:
      - Authorization: []
    put:
      tags:
      - Profile
      summary: Aktualizacja profilu
      operationId: updateProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileResponse'
      security:
      - Authorization: []
    delete:
      tags:
      - Profile
      summary: Usuwanie profilu bez powiązanych relacji.
      operationId: removeProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Authorization: []
    servers:
    - url: https://api.jaskier.uw.edu.pl
  /api/v1/Profile/{id}/ScienceDiscipline:
    get:
      tags:
      - Profile
      summary: Czytanie listy powiązanych dyscyplin naukowych
      operationId: getProfileScienceDisciplines
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileScienceDisciplineResponse'
      security:
      - Authorization: []
    put:
      tags:
      - Profile
      summary: Dodawanie dyscyplin naukowych do profilu
      operationId: addProfileScienceDiscipline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
