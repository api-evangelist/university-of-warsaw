          type: string
        sharedCompetencies:
          type: array
          items:
            type: string
        learningPathways:
          type: array
          items:
            type: string
        syllabusShortDescription0:
          type: string
        syllabusAssessmentsInfo0:
          type: string
        syllabusLearningOutcomes0:
          type: string
        syllabusPrerequirements0:
          type: string
        syllabusLanguageCode0:
          type: string
        coursesRegistrationId:
          type: string
