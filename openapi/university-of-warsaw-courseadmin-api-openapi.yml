          format: int32
        placesLimit4eu:
          type: integer
          format: int32
        workload:
          type: integer
          format: int32
        title:
          type: string
        levels4eu:
          type: array
          items:
            type: string
            enum:
            - BA
            - MA
            - PhD
            - PST
        startDate4eu:
          type: string
          format: date
        endDate4eu:
          type: string
          format: date
        title4eu:
          type: string
        facultyOrUnit4eu:
          type: string
        ects4eu:
          type: number
          format: double
        importSourceType:
          type: string
        applicationDeadline:
          type: string
          format: date
        sharedCompetencies4eu:
          type: array
