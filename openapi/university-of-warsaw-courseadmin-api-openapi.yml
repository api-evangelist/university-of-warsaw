          type: string
        learningOutcomes:
          type: string
        assessmentsInfo:
          type: string
        lang:
          type: string
    AbstractResponse:
      type: object
      properties:
        id:
          type: string
        langCode:
          type: string
        title:
          type: string
        abstr:
          type: string
        keyw:
          type: array
          items:
            type: string
        orderIndex:
          type: integer
          format: int32
        objectId:
          type: string
        objectType:
          type: string
        original:
          type: boolean
    CourseSp4euResponse:
      type: object
